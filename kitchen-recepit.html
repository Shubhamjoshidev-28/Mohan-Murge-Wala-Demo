<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Main Kitchen KOT</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="receipt-page-body">

  <div class="receipt-toolbar no-print">
    <a href="index.html" class="btn btn-ghost btn-sm">&larr; Back</a>
    <div class="kot-toolbar-actions no-print">
      <button id="selectAllBtn" type="button" class="btn btn-ghost btn-sm">Select All</button>
      <button id="clearAllBtn" type="button" class="btn btn-ghost btn-sm">Clear</button>
      <button id="printBtn" type="button" class="btn btn-primary btn-sm">Print Selected</button>
    </div>
  </div>

  <div id="receiptError" class="receipt-error" role="alert" hidden></div>

  <div id="receiptContent" class="kot-receipt" hidden>
    <div class="kot-title">KOT</div>

    <div class="kot-table-row">
      <span>TABLE</span>
      <span id="receiptTable" class="kot-table-number">&mdash;</span>
    </div>

    <div class="kot-divider"></div>

    <div class="kot-items-head">
      <span>ITEM</span>
      <span>QTY</span>
    </div>

    <div id="receiptItems" class="kot-items"></div>
  </div>

  <script src="./html2canvas.min.js"></script>
  <script src="./bridge-print.js"></script>
  <script src="./main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.MohanPOS && typeof MohanPOS.initReceipt === "function") {
        MohanPOS.initReceipt("main-kitchen");
      } else {
        document.getElementById("receiptError").hidden = false;
        document.getElementById("receiptError").textContent =
          "The application failed to load. Please refresh the page.";
      }
    });
  </script>
</body>
</html>
